<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Grade Calculator</h1>
    <p>Calculate your total marks, percentage and grade.</p>
    

    <form id="gradeForm">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter your name" required>
        <br>
        <h2>Enter Your Marks</h2>
        <br>
    <label for="english">English:</label>
    <input type="number" id="english" min="0" max="100" required>
    <br>


    <br>
    <label for="physics">Physics:</label>
    <input type="number" id="physics" min="0" max="100" required>
    <br>

    <br>
    <label for="maths">Mathematics:</label>
    <input type="number" id="maths" min="0" max="100" required>
    <br>

    <br>
    <label for="chemistry">Chemistry:</label>
    <input type="number" id="chemistry" min="0" max="100" required>
    <br>

    <br>
    <label for="computer">Computer Science:</label>
    <input type="number" id="computer" min="0" max="100" required>
    <br>

    <br>
    <button type="submit">Calculate Grade</button>
    <br>
    </form>

    <section id="result">
        <h2> Result
        </h2>
        <p> Total marks: <span id="total">--</span>/500</p>
        <p>percentage: <span id="percentage">--</span></p>
        <p>Grade: <span id="grade">--</span></p>
    </section>
<script src="./script.js"></script>
</body>
</html>
